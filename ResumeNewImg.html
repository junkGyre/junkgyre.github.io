<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LCARS Personnel Console</title>

<style>
:root {
    --orange:#ff9c2a;
    --peach:#ffb36b;
    --purple:#c792ea;
    --magenta:#ff6fae;
}

body {
    margin:0;
    background:#000;
    font-family:Arial, sans-serif;
    overflow:hidden;
}

/* SCANLINE EFFECT */
body::after {
    content:"";
    position:fixed;
    inset:0;
    background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.03),
        rgba(255,255,255,0.03) 1px,
        transparent 2px
    );
    pointer-events:none;
}

/* LAYOUT */
.lcars {
    display:grid;
    grid-template-columns:90px 1fr;
    height:100vh;
}

.left {
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:10px 0;
}

.elbow {
    height:120px;
    background:var(--orange);
    border-top-right-radius:60px;
    animation:pulse 4s infinite;
}

.bar {
    height:40px;
    border-radius:0 20px 20px 0;
}

.orange{background:var(--orange);}
.peach{background:var(--peach);}
.purple{background:var(--purple);}

@keyframes pulse {
    0%,100%{filter:brightness(1);}
    50%{filter:brightness(1.2);}
}

/* MAIN */
.main {
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.row {
    display:flex;
    gap:10px;
}

.button {
    flex:1;
    padding:14px;
    border-radius:30px;
    display:flex;
    justify-content:space-between;
    font-weight:bold;
    cursor:pointer;
    transition:.15s;
}

.button:hover {filter:brightness(1.15);}
.button:active {filter:brightness(1.3);}

/* STATUS LIGHT */
.status {
    width:10px;
    height:10px;
    border-radius:50%;
    background:#0f0;
    margin-left:10px;
    animation:blink 1.2s infinite;
}

@keyframes blink {
    0%,50%,100%{opacity:1;}
    25%,75%{opacity:0.2;}
}

/* PANEL */
.overlay {
    position:fixed;
    right:-100%;
    top:0;
    width:90%;
    max-width:650px;
    height:100%;
    background:#111;
    transition:.4s cubic-bezier(.7,0,.3,1);
    display:flex;
    flex-direction:column;
}

.overlay.active {right:0;}

/* HEADER */
.header {
    background:var(--orange);
    padding:16px;
    display:flex;
    justify-content:space-between;
}

/* CONTENT */
.content {
    padding:20px;
    overflow-y:auto;
    color:#ddd;
}

/* TYPEWRITER */
.type {
    overflow:hidden;
    white-space:nowrap;
    border-right:2px solid var(--peach);
    animation:typing 2s steps(40,end), blinkCaret .7s step-end infinite;
}

@keyframes typing {
    from {width:0}
    to {width:100%}
}

@keyframes blinkCaret {
    50%{border-color:transparent;}
}

/* DATA READOUT */
.metric {
    font-size:18px;
    margin:10px 0;
}

/* JOBS */
.job {
    margin-bottom:10px;
    cursor:pointer;
}

.job-title {
    background:#222;
    padding:10px;
    border-radius:10px;
}

.job-content {
    display:none;
    padding:10px;
}

.job.active .job-content {
    display:block;
}
/* === LCARS INTERACTION EFFECTS === */

/* BUTTON ENHANCEMENT */
.button {
    position: relative;
    overflow: hidden;
}

/* glow sweep */
.button::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        120deg,
        transparent 30%,
        rgba(255,255,255,0.25),
        transparent 70%
    );
    opacity: 0;
    transform: translateX(-100%);
}

/* hover = soft glow + lift */
.button:hover {
    filter: brightness(1.15) saturate(1.1);
    transform: translateY(-2px);
}

/* animated sweep */
.button:hover::before {
    opacity: 1;
    transform: translateX(100%);
    transition: transform 0.5s ease;
}

/* press */
.button:active {
    transform: scale(0.96);
    filter: brightness(1.3);
}

/* MOBILE TAP */
.button.touch-active {
    filter: brightness(1.3);
}

/* PANEL OPEN FLASH */
.overlay {
    box-shadow: none;
}

.overlay.active {
    animation: panelActivate 0.35s ease;
}

@keyframes panelActivate {
    0% {
        filter: brightness(1.8);
        transform: translateX(40px);
    }
    100% {
        filter: brightness(1);
        transform: translateX(0);
    }
}

/* JOB EXPAND ANIMATION */
.job-content {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: all 0.3s ease;
}

.job.active .job-content {
    max-height: 500px;
    opacity: 1;
}

/* JOB TITLE INTERACTION */
.job-title {
    transition: 0.2s;
}

.job-title:hover {
    filter: brightness(1.2);
}

/* LCARS "thinking pulse" */
@keyframes thinking {
    0%,100% { opacity: 1; }
    50% { opacity: 0.5; }
}

.button:hover .label {
    animation: thinking 1.2s infinite;
}
</style>
</head>

<script>
function animateNumbers() {
    document.querySelectorAll("[data-value]").forEach(el=>{
        let target = +el.dataset.value;
        let count = 0;
        let step = target / 40;
        let interval = setInterval(()=>{
            count += step;
            if(count >= target){
                el.innerText = target;
                clearInterval(interval);
            } else {
                el.innerText = Math.floor(count);
            }

// Convert to decimal years
function toDecimal(d){
    if(d==="Present") return 2026;
    if(d.includes("-")){
        const [y,m] = d.split("-");
        return parseInt(y)+(parseInt(m)-1)/12;
    }
    return parseFloat(d);
}

const careerData = careerRaw.map(d=>({...d, start:toDecimal(d.start), end:toDecimal(d.end)}));

function renderTimeline(){
    const container = document.getElementById("careerTimeline");
    container.innerHTML="";
    const width = container.offsetWidth;
    const height = container.offsetHeight;
    const padding = 80;
    const svgNS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(svgNS,"svg");
    svg.setAttribute("width","100%");
    svg.setAttribute("height",height);

    const minYear = Math.floor(Math.min(...careerData.map(d=>d.start)));
    const maxYear = Math.ceil(Math.max(...careerData.map(d=>d.end)));

    function x(year){ return padding + (year - minYear)/(maxYear-minYear)*(width-padding*2); }

    // Lanes
    let lanes=[];
    function getLane(d){
        for(let i=0;i<lanes.length;i++){
            if(!lanes[i].some(e=>!(d.end<e.start || d.start>e.end))){
                lanes[i].push(d);
                return i;
            }
        }
        lanes.push([d]);
        return lanes.length-1;
    }

    // Tooltip
    const tooltip = document.createElement("div");
    tooltip.style = "position:fixed;background:#111;color:#fff;padding:8px;border-radius:6px;font-size:12px;display:none;z-index:9999;";
    document.body.appendChild(tooltip);

    const colors = ["var(--orange)","var(--peach)","var(--purple)"];

    careerData.forEach(d=>{
        const lane = getLane(d);
        const y = 40 + lane*30;

        const rect = document.createElementNS(svgNS,"rect");
        rect.setAttribute("x",x(d.start));
        rect.setAttribute("y",y);
        rect.setAttribute("width",Math.max(4,x(d.end)-x(d.start)));
        rect.setAttribute("height",16);
        rect.setAttribute("rx",4);
        rect.setAttribute("fill", colors[lane%colors.length]);

        rect.addEventListener("mousemove", e=>{
            tooltip.style.display="block";
            tooltip.style.left = e.clientX + 10 + "px";
            tooltip.style.top = e.clientY + 10 + "px";
            tooltip.innerHTML=`<b>${d.company}</b><br>${d.role}<br>${d.start.toFixed(2)} - ${d.end.toFixed(2)}`;
        });
        rect.addEventListener("mouseleave", ()=>tooltip.style.display="none");

        svg.appendChild(rect);
    });

    // Axis
    for(let y=Math.floor(minYear); y<=maxYear; y+=2){
        const tick = document.createElementNS(svgNS,"text");
        tick.setAttribute("x", x(y));
        tick.setAttribute("y", height-10);
        tick.setAttribute("text-anchor","middle");
        tick.setAttribute("font-size","10");
        tick.setAttribute("fill","#ddd");
        tick.textContent = y;
        svg.appendChild(tick);
    }

    container.appendChild(svg);
}
</script>
